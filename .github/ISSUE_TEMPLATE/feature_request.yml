name: Feature request
description: Suggest an idea for SuperTunnel
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement!
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the feature.
      placeholder: Short summary of the feature
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem does this feature address?
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe your proposed solution.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: additional
    attributes:
      label: Additional context


